[defaults]
# --- Basic Connectivity & Paths ---
inventory      = ./inventory       ; Path to your inventory file or directory
remote_user    = ansible           ; The default SSH user to log in as
host_key_checking = False          ; Skip SSH "authenticity" prompts (useful for automation)
forks          = 10                ; Number of parallel processes to use (default is 5)
sudo_user      = root              ; Default user used for privilege escalation

# --- Logging & Output ---
stdout_callback = yaml             ; Formats output to be more readable (human-readable YAML)
callbacks_enabled = timer, profile_tasks ; Adds time spent on each task to the output
log_path       = ./ansible.log     ; Where Ansible logs its actions (optional)

# --- Behavior ---
roles_path     = ./roles           ; Where Ansible looks for additional roles
collections_path = ./collections   ; Where Ansible looks for installed collections
timeout        = 30                ; Default SSH connection timeout in seconds
retry_files_enabled = False        ; Stops Ansible from creating .retry files on failure

[privilege_escalation]
become         = True              ; Always try to escalate privileges (sudo)
become_method  = sudo              ; Method used for escalation (usually sudo)
become_user    = root              ; User you become after escalation
become_ask_pass = False            ; Set to True if sudo requires a password prompt

[ssh_connection]
# --- SSH Optimization ---
pipelining     = True              ; Reduces SSH operations for faster task execution
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s ; Keeps SSH connections open for reuse
scp_if_ssh     = Smart             ; Uses SCP if SSH isn't available for file transfers

[persistent_connection]
connect_timeout = 30               ; How long to wait for a persistent connection
command_timeout = 30               ; How long to wait for an individual command

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml ; List of enabled inventory plugins
