[defaults]
# --- Inventory ---
inventory             = ./inventory          # Path to inventory file or directory
inventory_plugins     = ~/.ansible/plugins/inventory  # Paths to inventory plugins

# --- Remote User & Privilege Escalation ---
remote_user           = ansible              # Default SSH user for remote connections
become                = false               # Enable privilege escalation (sudo) by default
become_method         = sudo                # Method to use for privilege escalation (sudo, su, pbrun, etc.)
become_user           = root                # User to escalate to
become_ask_pass       = false               # Prompt for privilege escalation password

# --- SSH / Connection ---
host_key_checking     = true                # Verify SSH host keys (set false to skip, not recommended in prod)
private_key_file      = ~/.ssh/id_rsa       # Default SSH private key file
remote_port           = 22                  # Default SSH port
timeout               = 30                  # SSH connection timeout in seconds
pipelining            = false               # Enable SSH pipelining to reduce SSH operations (improves speed)
ssh_args              = -C -o ControlMaster=auto -o ControlPersist=60s  # Extra SSH arguments

# --- Playbook Execution ---
forks                 = 5                   # Number of parallel processes (hosts) to run at once
poll_interval         = 15                  # Interval (seconds) between async task status polls
gathering             = implicit            # Fact gathering mode: implicit, explicit, or smart
gather_subset         = all                 # Subset of facts to gather (all, min, network, hardware, etc.)
gather_timeout        = 10                  # Timeout for fact gathering in seconds
any_errors_fatal      = false               # Abort entire play if any host fails
max_fail_percentage   = 0                   # Max % of hosts that can fail before aborting (0 = any failure aborts)
serial                = 0                   # Number/percentage of hosts to run at a time (0 = all)

# --- Roles ---
roles_path            = ./roles:~/.ansible/roles:/usr/share/ansible/roles  # Colon-separated paths to search for roles
default_roles_path    = ~/.ansible/roles    # Default path for roles

# --- Collections ---
collections_path      = ~/.ansible/collections:/usr/share/ansible/collections  # Paths to search for collections
collections_on_ansible_version_mismatch = warning  # Action on version mismatch: warning, ignore, error

# --- Callbacks & Output ---
stdout_callback       = default             # Callback plugin for stdout (e.g., default, yaml, json, minimal, dense)
callback_whitelist    = timer, profile_tasks  # Additional callback plugins to enable (deprecated in 2.11+)
callback_enabled      = timer, profile_tasks  # Replacement for callback_whitelist (Ansible 2.11+)
bin_ansible_callbacks = false               # Enable callbacks for ad-hoc commands
display_skipped_hosts = true                # Show skipped hosts in output
display_ok_hosts      = true                # Show OK hosts in output
show_custom_stats     = false               # Display custom stats at end of playbook run
verbosity             = 0                   # Default verbosity level (0-4)

# --- Logging ---
log_path              = /var/log/ansible.log  # Path to log file (empty = no logging)
no_log                = false               # Suppress sensitive output globally

# --- Retry Files ---
retry_files_enabled   = false               # Create .retry files on failure
retry_files_save_path = ~/.ansible-retry    # Directory to save .retry files

# --- Vault ---
vault_password_file   = ~/.vault_pass       # Path to vault password file
vault_identity_list   = default@~/.vault_pass  # List of vault identities and their password files

# --- Modules ---
library               = ./library           # Path to custom modules
module_utils          = ./module_utils      # Path to custom module utilities
action_plugins        = ./action_plugins    # Path to action plugins
lookup_plugins        = ./lookup_plugins    # Path to lookup plugins
filter_plugins        = ./filter_plugins    # Path to filter plugins
vars_plugins          = ./vars_plugins      # Path to vars plugins
callback_plugins      = ./callback_plugins  # Path to callback plugins
connection_plugins    = ./connection_plugins  # Path to connection plugins
strategy_plugins      = ./strategy_plugins  # Path to strategy plugins

# --- Strategy ---
strategy              = linear              # Execution strategy: linear, free, or debug
strategy_plugins      = ~/.ansible/plugins/strategy  # Path to strategy plugins

# --- Diff & Check Mode ---
always_show_errors    = true                # Always show error output even in check mode

# --- Deprecation & Warnings ---
deprecation_warnings  = true                # Show deprecation warnings
system_warnings       = true                # Show system-related warnings
command_warnings      = true                # Warn when shell/command modules could be replaced by modules
invalid_task_attribute_passed = error       # Action on invalid task attribute: error, warn, ignore

# --- Jinja2 / Templating ---
jinja2_extensions     =                     # Comma-separated list of Jinja2 extensions to enable
jinja2_native         = false               # Enable Jinja2 native types (returns Python objects instead of strings)

# --- Miscellaneous ---
executable            = /bin/sh             # Shell to use on remote hosts
module_lang           = C                   # Language locale for modules
module_set_locale     = false               # Set locale for modules
error_on_undefined_vars = true              # Raise error on undefined variables in templates
force_handlers        = false               # Run handlers even if a task fails
interpreter_python    = auto                # Python interpreter discovery: auto, auto_legacy, /path/to/python
allow_world_readable_tmpfiles = false       # Allow world-readable temp files (security risk)
var_compression_threshold = 8192           # Compress variables larger than this size (bytes) over the wire
string_conversion_action = warn             # Action when converting non-string values: warn, error, ignore

[inventory]
enable_plugins        = host_list, script, auto, yaml, ini, toml  # Inventory plugins to enable (in order)
ignore_extensions     = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt  # File extensions to ignore in inventory dirs
ignore_patterns       =                     # Patterns to ignore in inventory directories
unparsed_is_failed    = false               # Treat unparsed inventory as failure

[privilege_escalation]
become                = false               # Enable privilege escalation
become_method         = sudo                # Escalation method
become_user           = root                # Target user for escalation
become_ask_pass       = false               # Prompt for escalation password

[paramiko_connection]
record_host_keys      = true                # Record unknown host keys in ~/.ssh/known_hosts
look_for_keys         = true                # Search for SSH keys automatically
host_key_auto_add     = false               # Auto-add host keys (less secure)

[ssh_connection]
ssh_args              = -C -o ControlMaster=auto -o ControlPersist=60s  # SSH arguments passed to OpenSSH
control_path_dir      = ~/.ansible/cp       # Directory for SSH ControlPath sockets
control_path          =                     # Custom ControlPath template (overrides control_path_dir)
pipelining            = false               # Enable SSH pipelining (requires requiretty disabled in sudoers)
scp_if_ssh            = smart               # Use SCP instead of SFTP: smart, true, false
sftp_batch_mode       = true                # Use SFTP batch mode
use_tty               = true                # Allocate a pseudo-TTY for SSH connections
retries               = 3                   # Number of SSH connection retries on failure
reconnection_retries  = 0                   # Number of reconnection retries for persistent connections
usetty                = true                # Use TTY for SSH connections

[persistent_connection]
connect_timeout       = 30                  # Timeout for persistent connection setup (seconds)
connect_retry_timeout = 15                  # Timeout between persistent connection retries (seconds)
command_timeout       = 30                  # Timeout for commands over persistent connections (seconds)

[accelerate]
accelerate_port       = 5099               # Port for accelerated mode (deprecated)
accelerate_timeout    = 30                 # Timeout for accelerated connections (deprecated)
accelerate_connect_timeout = 5.0          # Connection timeout for accelerated mode (deprecated)

[selinux]
special_context_filesystems = fuse, nfs, vboxsf, ramfs, 9p, vfat  # Filesystems that need special SELinux context handling

[colors]
highlight             = white               # Color for highlighted output
verbose               = blue                # Color for verbose output
warn                  = bright purple       # Color for warnings
error                 = red                 # Color for errors
debug                 = dark gray           # Color for debug output
deprecate             = purple              # Color for deprecation warnings
skip                  = cyan                # Color for skipped tasks
unreachable           = red                 # Color for unreachable hosts
ok                    = green               # Color for OK/success output
changed               = yellow              # Color for changed tasks
diff_add              = green               # Color for added lines in diff output
diff_remove           = red                 # Color for removed lines in diff output
diff_lines            = cyan                # Color for diff line numbers

[diff]
always                = false               # Always show diff output (equivalent to --diff flag)
context               = 3                   # Number of context lines to show in diffs
